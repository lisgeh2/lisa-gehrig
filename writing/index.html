<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of poems, creative writing, and essays.">
  <title>Quiet pages</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23faf9f6'/%3E%3Cpath d='M10 8h12v17H10zM13 13h6m-6 4h6m-6 4h4' fill='none' stroke='%236b665e' stroke-width='1'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink: #393832; --muted: #77736c; --line: #e6e3dc; --page: #fdfcf9; }
    * { box-sizing: border-box; }
    html { scrollbar-gutter: stable; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; }
    main { max-width: 860px; margin: 0 auto; padding: 86px 44px 64px; }
    header { margin-bottom: 94px; }
    h1 { font-size: clamp(2.4rem, 6vw, 3.5rem); font-weight: 400; letter-spacing: -.055em; margin: 0; line-height: 1.2; }
    header p { color: var(--muted); font-size: 1rem; margin: 18px 0 0; font-style: italic; }
    section { padding: 0 0 66px; }
    section + section { border-top: 1px solid var(--line); padding-top: 46px; }
    h2 { margin: 0 0 27px; font-size: 1.125rem; font-weight: 400; font-style: italic; }
    .titles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .title { text-align: left; background: #fffefa; border: 1px solid #bfb6a6; border-radius: 9px; padding: 16px 18px; min-height: 64px; font-size: 1rem; line-height: 1.45; overflow-wrap: anywhere; color: #302e29; box-shadow: 0 3px 7px #4943350d, 0 1px 2px #49433509; cursor: pointer; transition: background .2s, border-color .2s, box-shadow .2s, transform .2s; }
    .title:hover, .title:focus-visible { background: #fff; border-color: #92836b; box-shadow: 0 9px 20px #4943351a, 0 3px 6px #4943350c; transform: translateY(-3px); }
    .title:active { background: #f7f4ed; border-color: #a79c88; box-shadow: 0 1px 2px #4943350a; transform: translateY(0); }
    button:focus-visible { outline: 2px solid #8d8372; outline-offset: 4px; }
    footer { text-align: center; padding: 10px 0 0; color: #8b857c; font-size: 1.25rem; }
    dialog { border: 1px solid #e9e5dc; border-radius: 1px; padding: 0; width: min(680px, calc(100% - 40px)); max-height: calc(100dvh - 64px); background: #fffefb; color: var(--ink); box-shadow: 0 20px 90px #302a202b, 0 2px 10px #302a200a; overflow-y: auto; overscroll-behavior: contain; }
    dialog::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .15; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.19' filter='url(%23n)'/%3E%3C/svg%3E"); }
    dialog::backdrop { background: #d9d6cf65; backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
    dialog[open] { animation: unfold .22s ease-out; }
    .close { position: sticky; top: 14px; display: block; margin: 14px 14px -58px auto; width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fffefbe6; color: #827b70; cursor: pointer; z-index: 1; }
    .close svg { width: 18px; height: 18px; vertical-align: middle; }
    article { position: relative; padding: 85px 78px 90px; min-height: 540px; font-size: 1.125rem; line-height: 1.85; overflow-wrap: break-word; }
    article p { margin: 0 0 1.5em; white-space: pre-wrap; }
    article p:last-child { margin-bottom: 0; }
    body.reading { overflow: hidden; }
    @keyframes unfold { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 700px) { .titles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { main { padding: 56px 25px 40px; } header { margin-bottom: 64px; } .titles { gap: 10px; } section { padding-bottom: 42px; } section + section { padding-top: 34px; } dialog { width: calc(100% - 24px); max-height: calc(100dvh - 32px); } article { padding: 72px 29px 58px; min-height: 420px; font-size: 1.0625rem; } }
    @media (max-width: 420px) { .titles { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Quiet pages</h1><p>Poems, stories &amp; other things kept.</p></header>
    <div id="collection"></div>
    <footer aria-hidden="true">∗</footer>
  </main>
  <dialog id="reader" aria-label="Reading sheet">
    <button class="close" aria-label="Close reading sheet" autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <article id="text"></article>
  </dialog>
  <script>
    // Replace these original sample pieces with your own titles and writing.
    // Use \n for a line break and \n\n for a new stanza or paragraph.
    const collections = [
      { name: 'Poems', pieces: [
        { title: 'nur de schimmelpilz isch wach', text: `en graue suntig morge\nich wirde niemeh wach\nund dfarbe sind verdorbe\n\nbin vo allne pflichte crusht\nHuuspflanze die sind gstorbe\nnur de schimmelpilz isch wach\n\ner luegt mich ah und denn, da lachter\ner seit “youre a piece of shit”\nund ich “du au! und jetz heb klappe”\nau wenns mer garnüt git` },
        { title: 'I saw sparks', text: `Ist da was?\nein kleiner Funke\nkurz und schwach\n\nDoch ich glaube\nUnd der Glaube lässt ihn wachsen\nerst fein dann immer mehr\nbis die Flammen tanzen\n\nJetzt gibt es keine Rückkehr mehr\n\nUnd wenn ich brenne\nalles andere schwarz und kalt\nbrennst du mit?\noder machst du halt?` },
        { title: 'Mann mit dem Hut', text: `Mantel, seltsamer Hut, er steht gelassen\nHand in der Tasche, Kaffee in der Tasse\nIst vertieft - bis er dich sieht in der Masse\n\nAlles blüht auf, aus dünn wird breit\nWeil er sich jetzt zum umarmen ausspreizt\n“Heeeeeeeeeyyy”\n\nDer Fokus auf dich\nAls wärst du ein Rätsel, dass es zu lösen gilt\neine Zeitung nach 100 Stunden Zeitvertrieb\nAls wäre ich viel mehr, als wonach es aussieht\n\nDoch\nEs bin nicht ich, es brodelt in ihm selbst\nBaut Türme und Welten\nMit einer Leidenschaft, das sieht man selten\n\nDoch Wörter sind zu banal um zu erfassen\nWas alles scheint in seinen Kopf zu passen\nWörter haben nur eine Bedeutung zur Zeit\nDummerweise wäre er zu fünf bereit!\n\nEin gewaltiger Sturm in seinem Schädel\nWird über Sprache zum Windlein verschmältert\nund wenn es ankommt im Kopfe des Anderen\nist kaum mehr ein Windhauch vorhanden\n\nDie Tragödie spielt sich ab jeden Tag\nDoch der Mann mit dem Hut\nDen stört es nicht arg\n\nBis ans Ende seiner Tage wird er Kaffee trinken\nUnd den Sturm in seinem Kopf versuchen anderen zu schenken` },
        { title: 'heart poem', text: `thumb on my heart\nto check if it still beats\nwhile my mind solves equations\ndutifully rationnally\n\nchecks in with mmd bloodpump\nthat only runs towards p\nbut is trapped in a body\n\nFriends check in on me\nI say I’m okay\nI laugh and talk\n\nonly from time to time\nfeel my heart\nstill beating thats good\nshe hasn’t jumped out and left\nto be with p instead\n\nAnd I wonder what is ps hearts up to?\nI wanna feel it\nsee if it still beats\n\nand our minds would talk\nabout what we had for lunch\nabout equation perhaps\n\n“oh so rational”\nthe heart complains` }
      ] },
      { name: 'Creative writing', pieces: [
        { title: 'hypothesen', text: `starre auf mein Handy\nwenn ich die Minuten zähle um deine Liebe zu quantifizieren\nwill uns analysieren, die Hypothese verifizieren\ndoch 381 ist nicht signifikant.\n\n5 wären es vielleicht\nUnd so outcome switche ich weiter\nsammle mehr und mehr variabeln, du siehst mir in die Augen, lächelst mich an, sagst ein Kompliment, das muss doch kleiner als 5 prozent…\nDoch die Stichprobe ist äquivalent\n\n“don’t be too attached to your theory” sagt man uns\nWeil man sonst blind wird -\nich sehe sowieso nur noch rosa\nUnd deine Augen wenn ich meine schliesse…ah\n\nStop, verlier dich nicht, konzentrier dich auf die Zahlen, sie sind fair und klar\nin schwarz und weiss, was falsch ist oder wahr, sie messen meine Leistung, meinen wert,\nMein aussehen + intelligenz + social skills = im Delta positiv mit dir?\nbin ich genug für dich?\n3.14159265 ach bemerkst du mich nicht?\n\nDoch es funktioniert nicht so, all meine zahlen schwimmen in einer Suppe und werden aufgegessen.\nWird ein bild gemalt, vermischt, gesungen, getanzt, gedichtet, kontrolle verloren\n\nmich selbst verloren` },
        { title: 'Paris', text: `7 am\nI step outside and the city is blue\nMy shampoo in my arms like a teddy bear from home I hold onto\n\nI am welcomed with an overwhelming wave of city noise, my voice to frail and quiet to be ever heard\nThe concrete is groaning under the ever-moving crowd\nSirenes and car sounds\nthat make me fearful, wide-eyed like a lost deer from the forrest\nAdrenalin in my blood, I hasten to match their pace\nExcept, I’m a stranger in all of this\n\nThe metro arrives, I step in\nBut even that seems to slow for people\nThey cannot stop\nEvery second in movement\nin progress\nin output\n\nWhat is it that you’re being chased by? That you are so scared of?\nThe shame of unproductivity? The fear of becoming unimportant in a sea of struggling humans?\n\nI look around me and I see more screens than faces\nPeople buying tickets, watching pretty actors, playing colorful games, consuming news\n\nEverything\nbut to hear the sound of your own soul` },
      ] },
      { name: 'Essays', pieces: [
        { title: 'Symbolik der Reiswaffel', text: `Wenn Sie sich in Oerlikon um die Universitätsgebäude herumtreiben, wird Ihnen neben Menschen mit Laptops, Kaffees und Handys sicherlich auch folgendes neuzeitliche Phänomen aufgefallen sein:\n\nStudierende mit runden, farblosen Packungen in der Hand: die Reiswaffel.\n\nSchnell wird diese Sichtigung abgetan wie jedes andere banale Ernährungsmittel, wird fälschlicherweise mit einem bio Mehrkornbrot oder einem kalorienarmen Vitaminwasser verglichen - Ohne das die zu betrachtende Person dabei die tieferliegende Symbolik des Reis-Gebäcks versteht.\n\nDie Reiswaffel ist für 70 Rappen in jedem Lebensmittelladen erhältlich. Mit 70 Rappen ist das eines der billigsten Konsumobjekte überhaupt, gerechnet auf 100 Kalorien lediglich 18 Rappen und schlägt somit jede Mensa-Speise (ca. 90 Rappen / 100 Kalorien) bei weitem.\n\nZudem ist das Produkt lokal hergestellt, glutenfrei, koscher, laktosefrei und vegan.\n\nDie Reiswaffel ist zugänglich für alle. Ob reich oder arm, laktoseverträglich oder nicht, vegan oder Fleisch-essend: die Reiswaffel ist tolerant. Nicht nur das, sie diskriminiert auch nicht bezüglich der Geschmackspräferenz. Dieses Problem umgeht sie elegant: Sie hat nämlich keinen.\n\nDie Reiswaffel ist nicht designt in einem grossen Stück, nein, sie hat 15 Teile. 15 identische Runde Waffel-Teile, welche zusammen das ganze Produkt bilden. Somit wird die Reiswaffel auf ganz natürliche Weise zu einem geteilten Gut. Freunde, Mitarbeiter, oder andere Menschen in der Nähe eines Reiswaffel-Konsumenten werden auf ganz natürliche Weise eingeladen, an der Reiswaffel teilzuhaben. Einen Teil der ganzen Reiswaffel zu haben. Einen Teil des ganzen zu sein. Und gemeinsam vom Haben zum Sein zu kommen, wie Fromm es formulieren würde.\n\nDoch Philosophie beiseite, mit nicht einmal fünf Rappen pro einzelne Reiswaffel wird jedermann zur Gönner*in, das Ego verschwindet und man wird zur Reiswaffel-Einheit. Man verbindet sich über den kleinsten Nenner, denn wir alle haben das Grundbedürfnis eines gefüllten Magens. Maslows grundlegendstes Bedürfnis wird gestillt, nur auf Basis dessen können wir uns höheren Werten wie der Ethik und Philosophie widmen.\n\nDie Reiswaffel ist nicht transaktional. Es geht um die Entwicklung der Beziehung zu einander, um das Teilen und gemeinsame Sein. Niemand erwartet eine Entschädigung für eine angebotene Reiswaffel.\n\nDie Reiswaffel wird daher im studentischen Alltag in hohen Grade unterschätzt.\n\nSie ist höchst tolerant, inklusiv und bildet eine direkte Kritik an der kapitalistischen Austauschgesellschaft. Sie fördert Verbinung und schafft neue Verbindungen wo noch keine waren. Eine Reiswaffel kann der Beginn einer Freundschaft, eines Jobangebots vielleicht sogar einer Heirat sein. Die Reiswaffel sprengt die Grenzen, welche uns voneinander trennen. Die Reiswaffel bildet die Grundlage, damit wir gemeinsam Grosses schaffen können.` }
      ] }
    ];
    const collection = document.querySelector('#collection');
    const reader = document.querySelector('#reader');
    const text = document.querySelector('#text');
    for (const [index, group] of collections.entries()) {
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      heading.id = `section-${index}`;
      heading.textContent = group.name;
      section.setAttribute('aria-labelledby', heading.id);
      const titles = document.createElement('div');
      titles.className = 'titles';
      for (const piece of group.pieces) {
        const button = document.createElement('button');
        button.className = 'title';
        button.textContent = piece.title;
        button.setAttribute('aria-haspopup', 'dialog');
        button.addEventListener('click', () => {
          text.replaceChildren();
          for (const paragraph of piece.text.split('\n\n')) {
            const p = document.createElement('p');
            p.textContent = paragraph;
            text.append(p);
          }
          reader.setAttribute('aria-label', piece.title);
          reader.showModal();
          reader.scrollTop = 0;
          document.body.classList.add('reading');
        });
        titles.append(button);
      }
      section.append(heading, titles);
      collection.append(section);
    }
    reader.querySelector('.close').addEventListener('click', () => reader.close());
    let backdropStart = false;
    const outside = event => {
      const rect = reader.getBoundingClientRect();
      return event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
    };
    reader.addEventListener('pointerdown', event => { backdropStart = outside(event); });
    reader.addEventListener('click', event => { if (backdropStart && outside(event)) reader.close(); backdropStart = false; });
    reader.addEventListener('close', () => document.body.classList.remove('reading'));
  </script>
</body>
</html>
